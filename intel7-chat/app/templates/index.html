<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ service_name }}</title>
  <meta name="description" content="교실 내부 LAN 전용 실시간 채팅 서비스" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" type="image/png" href="/static/stealth-chat-logo.png" />
</head>
<body>

  <!-- 닉네임 모달 -->
  <div id="nickname-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-logo-container">
        <img src="/static/stealth-chat-logo.png" alt="Logo" class="modal-logo" />
      </div>
      <h2>{{ service_name }}에 입장하기</h2>
      <p class="modal-warning">⚠️ 10시간 후 모든 채팅 메시지는 삭제됩니다.</p>
      <p class="modal-desc">사용할 닉네임을 입력하세요 (최대 30자)</p>
      <input id="nickname-input" type="text" maxlength="30" placeholder="닉네임" autocomplete="off" autofocus />
      <p id="nickname-error" class="error-msg" aria-live="polite"></p>
      <button id="nickname-submit" type="button">입장</button>
    </div>
  </div>

  <!-- 앱 본체 -->
  <div id="chat-app" class="hidden">

    <!-- 헤더 -->
    <header class="app-header">
      <button id="sidebar-toggle" class="icon-btn sidebar-toggle-btn" title="사이드바">&#9776;</button>
      <div class="header-logo-container">
        <img src="/static/stealth-chat-logo.png" alt="Logo" class="header-logo" />
        <h1 class="service-name">{{ service_name }}</h1>
      </div>
      <div class="header-right">
        <span id="my-nick-badge" class="my-nick-badge"></span>
        <span id="conn-status" class="conn-status disconnected">연결 끊김</span>
      </div>
    </header>

    <!-- 바디: 사이드바 + 채팅 영역 -->
    <div class="app-body">

      <!-- ── 사이드바 ── -->
      <aside id="sidebar" class="sidebar">

        <!-- 대화 목록 -->
        <div class="sidebar-section sidebar-convs">
          <div class="sidebar-section-title">💬 대화</div>
          <ul id="conv-list" class="conv-list"></ul>
        </div>

        <!-- 구분선 -->
        <div class="sidebar-divider"></div>

        <!-- 온라인 유저 목록 -->
        <div class="sidebar-section sidebar-online">
          <div class="sidebar-section-title">
            🟢 접속 중 <span id="online-count">0</span>명
          </div>
          <ul id="online-list" class="online-list"></ul>
        </div>

      </aside>

      <!-- 사이드바 모바일 백드롭 -->
      <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

      <!-- ── 채팅 영역 ── -->
      <div class="chat-area">
        <div class="chat-area-header">
          <span id="chat-area-title" class="chat-area-title">전체 채팅</span>
        </div>
        <main id="message-list" class="message-list"></main>
        <footer class="input-bar">
          <input
            id="msg-input"
            type="text"
            maxlength="500"
            placeholder="메시지를 입력하세요 (Enter로 전송)"
            autocomplete="off"
          />
          <button id="send-btn" type="button">전송</button>
        </footer>
      </div>

    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>

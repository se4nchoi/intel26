[project]
name = "advanced-robot-programming"
version = "0.2.0"
description = "A simulation-first Neuromeka workcell with explicit cycle and recovery control"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "neuromeka==3.4.2.2",
    "numpy>=1.26.4,<3",
    "opencv-python>=4.11.0.86,<5",
    "pymcprotocol==0.3.0",
    "pydantic>=2.12,<3",
    "pyrealsense2>=2.58.4.10922,<3",
    "uvicorn>=0.52.4,<0.53",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[project.scripts]
workcell = "workcell.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workcell"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
